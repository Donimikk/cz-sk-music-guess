<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hudle</title>
  <meta name="description" content="Uhádni českú alebo slovenskú pesničku z prvých sekúnd.">
  <meta name="theme-color" content="#0F0F23">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23050608'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237CF0C5'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23050608'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mood" id="mood" aria-hidden="true"></div>
  <div class="column">
    <header class="top">
      <h1 class="wordmark" id="wordmark" aria-label="Hudle"><span aria-hidden="true">Hud</span><span class="logo-disc" aria-hidden="true"></span><span aria-hidden="true">le</span></h1>
      <span class="tagline">Uhádni pesničku</span>
    </header>

    <main>
      <p class="puzzle">Uhádni českú alebo slovenskú pesničku z čo najkratšej ukážky.</p>
      <div class="levels" id="levels" role="radiogroup" aria-label="Obtiažnosť"></div>
      <div class="filters">
        <button class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterPanelWrap">Filtre</button>
        <div class="filter-panel-wrap" id="filterPanelWrap" hidden>
          <div id="filterPanel"></div>
          <div class="filter-foot"><span id="filterInfo"></span><button class="giveup" id="filterClear" hidden>Zrušiť filtre</button></div>
        </div>
      </div>
      <ol class="attempts" id="board" aria-label="Pokusy"><li class="sk"></li><li class="sk"></li><li class="sk"></li><li class="sk"></li><li class="sk"></li></ol>

      <section class="player loading" id="player" aria-label="Prehrávač">
        <div class="turntable" aria-hidden="true">
          <div class="disc" id="disc">
            <span class="disc-label"><span class="disc-name">Hudle</span></span>
            <img class="disc-cover" id="cover" alt="">
          </div>
        </div>
        <div class="bar" id="bar" aria-hidden="true">
          <div class="bar-unlocked" id="unlocked"></div>
          <div class="bar-progress" id="progress"></div>
        </div>
        <div class="times">
          <span id="elapsed">0:00</span>
          <button class="play" id="play" aria-label="Prehrať ukážku" title="Medzerník" aria-keyshortcuts="Space" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playShape" d="M8 5v14l11-7z"/></svg>
          </button>
          <span id="total">0:16</span>
        </div>
        <p class="status" id="status" role="status"></p>
        <button id="retry" class="ghost retry" hidden>Skúsiť znova</button>
      </section>

      <section class="controls" id="controls" aria-label="Tvoj tip">
        <div class="search">
          <ul id="suggestions" role="listbox" aria-label="Návrhy"></ul>
          <input id="guess" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Interpret alebo názov pesničky"
                 role="combobox" aria-label="Tvoj tip" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false"
                 aria-keyshortcuts="Shift+Enter">
        </div>
        <div class="buttons">
          <button id="skip" class="ghost" title="Shift+Enter" aria-keyshortcuts="Shift+Enter">Preskočiť</button>
          <button id="submit" class="primary">Hádať</button>
        </div>
        <button id="giveup" class="giveup">Vzdať sa</button>
      </section>

      <section class="result" id="result" hidden>
        <p class="answer"><strong id="answerTitle"></strong><span id="answerArtist"></span></p>
        <div class="cover-wrap">
          <img class="result-cover" id="resultCover" alt="Obal albumu" width="132" height="132">
          <!-- arcade badges: thick shape, black outline, hard offset shadow -->
          <svg class="badge badge-ok" id="badgeOk" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M12 34 L26 48 L54 18" transform="translate(4 4)" fill="none" stroke="#000" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
            <path d="M12 34 L26 48 L54 18" fill="none" stroke="#000" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>
            <path d="M12 34 L26 48 L54 18" fill="none" stroke="#3DDC84" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
          <svg class="badge badge-bad" id="badgeBad" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 14 L50 50 M50 14 L14 50" transform="translate(4 4)" fill="none" stroke="#000" stroke-width="16" stroke-linecap="square"/>
            <path d="M14 14 L50 50 M50 14 L14 50" fill="none" stroke="#000" stroke-width="16" stroke-linecap="square"/>
            <path d="M14 14 L50 50 M50 14 L14 50" fill="none" stroke="#FF4D5E" stroke-width="9" stroke-linecap="square"/>
          </svg>
        </div>
        <p class="verdict" id="verdict"></p>
        <div class="buttons">
          <button id="share" class="primary">Zdieľať výsledok</button>
          <button id="next" class="ghost">Ďalšia pesnička</button>
        </div>
        <a id="apple" class="apple" target="_blank" rel="noopener">Počúvať v Apple Music</a>
        <p class="stats" id="stats"></p>
      </section>
    </main>

    <footer class="foot">
      Ukážky skladieb poskytuje Apple Music. Pesničky vyberáme podľa domácich rebríčkov a počtu prehratí.
    </footer>
  </div>

  <!-- GoatCounter: cookie-less visit counter; dashboard at domiiiinik.goatcounter.com (localhost isn't counted) -->
  <script data-goatcounter="https://domiiiinik.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script src="app.js"></script>
</body>
</html>
