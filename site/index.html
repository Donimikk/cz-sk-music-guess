<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hudle</title>
  <meta name="description" content="Denná hra: uhádni českú alebo slovenskú pesničku z prvých sekúnd.">
  <meta name="theme-color" content="#0F0F23">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23050608'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237CF0C5'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23050608'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="column">
    <header class="top">
      <h1 class="wordmark">Hudle</h1>
      <nav class="modes" aria-label="Režim hry">
        <button class="mode" data-mode="daily" aria-pressed="true">Denná</button>
        <button class="mode" data-mode="infinite" aria-pressed="false">Nekonečná</button>
      </nav>
    </header>

    <main>
      <p class="puzzle" id="subtitle"></p>
      <ol class="attempts" id="board" aria-label="Pokusy"></ol>

      <section class="player" aria-label="Prehrávač">
        <div class="turntable" aria-hidden="true">
          <div class="disc" id="disc">
            <span class="disc-label"><span class="disc-name">Hudle</span></span>
            <img class="disc-cover" id="cover" alt="">
          </div>
        </div>
        <div class="bar" id="bar" aria-hidden="true">
          <div class="bar-unlocked" id="unlocked"></div>
          <div class="bar-progress" id="progress"></div>
        </div>
        <div class="times">
          <span id="elapsed">0:00</span>
          <button class="play" id="play" aria-label="Prehrať ukážku" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playShape" d="M8 5v14l11-7z"/></svg>
          </button>
          <span id="total">0:16</span>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="controls" id="controls" aria-label="Tvoj tip">
        <div class="search">
          <ul id="suggestions" role="listbox" aria-label="Návrhy"></ul>
          <input id="guess" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Interpret alebo názov pesničky"
                 aria-label="Tvoj tip" aria-autocomplete="list" aria-controls="suggestions">
        </div>
        <div class="buttons">
          <button id="skip" class="ghost">Preskočiť</button>
          <button id="submit" class="primary">Hádať</button>
        </div>
      </section>

      <section class="result" id="result" hidden>
        <img class="result-cover" id="resultCover" alt="Obal albumu" width="120" height="120">
        <p class="verdict" id="verdict"></p>
        <p class="answer"><strong id="answerArtist"></strong><span id="answerTitle"></span></p>
        <div class="buttons">
          <button id="share" class="primary">Zdieľať výsledok</button>
          <button id="next" class="ghost" hidden>Ďalšia pesnička</button>
        </div>
        <a id="apple" class="apple" target="_blank" rel="noopener">Počúvať v Apple Music</a>
        <p class="stats" id="stats"></p>
      </section>
    </main>

    <footer class="foot">
      Ukážky skladieb poskytuje Apple Music. Pesničky vyberáme z domácich rebríčkov ČNS IFPI od roku 2020.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
